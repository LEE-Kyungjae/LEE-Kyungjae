<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" role="img" aria-labelledby="title desc">
  <title id="title">Gahyeon platform-independent real-time AI character architecture</title>
  <desc id="desc">Discord, Desktop, and Unreal clients connect through replaceable adapters to application use cases and a platform-independent core. PostgreSQL preserves memory, events, world state, and ledgers. Reflex, Behavior, and Cognition advance on separate time scales.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07151a"/><stop offset="1" stop-color="#0e1b26"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#34d399"/></marker>
    <style>
      .box{fill:#0f202a;stroke:#33505d;stroke-width:1}.core{stroke:#34d399;stroke-width:1.6}.external{stroke:#64748b;stroke-dasharray:5 4}.label{fill:#f8fafc;font:600 14px ui-sans-serif,system-ui,sans-serif}.sub{fill:#94a3b8;font:11px ui-sans-serif,system-ui,sans-serif}.eyebrow{fill:#6ee7b7;font:700 11px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.5px}.title{fill:#f8fafc;font:700 22px ui-sans-serif,system-ui,sans-serif}.flow{fill:none;stroke:#34d399;stroke-width:2;marker-end:url(#arrow2);stroke-dasharray:9 8;animation:move 3.5s linear infinite}.side{fill:none;stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 6;animation:move 5s linear infinite}.beat{animation:beat 2.8s ease-in-out infinite}.b2{animation-delay:.45s}.b3{animation-delay:.9s}@keyframes move{to{stroke-dashoffset:-68}}@keyframes beat{0%,22%,100%{opacity:.35}11%{opacity:1;filter:url(#glow2)}}@media(prefers-reduced-motion:reduce){.flow,.side,.beat{animation:none}}
    </style>
  </defs>
  <rect width="1180" height="470" rx="18" fill="url(#bg2)"/><rect width="1180" height="470" rx="18" fill="url(#grid2)"/>
  <text x="36" y="42" class="eyebrow">GAHYEON / REAL-TIME AI CHARACTER</text>
  <text x="36" y="72" class="title">One persistent character. Replaceable clients. Independent time scales.</text>

  <path class="flow" d="M176 138H205V215H235"/><path class="flow" d="M176 233H235"/><path class="flow" d="M176 328H205V251H235"/>
  <path class="flow" d="M403 233H468"/><path class="flow" d="M648 233H713"/><path class="flow" d="M903 233H968"/>
  <path class="side" d="M558 192V147"/><path class="side" d="M808 274V326"/><path class="side" d="M663 372H620V400H106V360" marker-end="url(#arrow2)"/>

  <g><rect class="box external" x="36" y="106" width="140" height="64" rx="11"/><text class="label" x="106" y="143" text-anchor="middle">Discord</text></g>
  <g><rect class="box external" x="36" y="201" width="140" height="64" rx="11"/><text class="label" x="106" y="238" text-anchor="middle">Desktop</text></g>
  <g><rect class="box external" x="36" y="296" width="140" height="64" rx="11"/><text class="label" x="106" y="333" text-anchor="middle">Unreal Stage</text></g>

  <g><rect class="box" x="235" y="190" width="168" height="86" rx="12"/><text class="label" x="319" y="226" text-anchor="middle">Platform adapters</text><text class="sub" x="319" y="249" text-anchor="middle">JDA · HTTP/SSE · WS</text></g>
  <g><rect class="box" x="468" y="192" width="180" height="82" rx="12"/><text class="label" x="558" y="226" text-anchor="middle">Application</text><text class="sub" x="558" y="249" text-anchor="middle">Conversation · Speech · World</text></g>
  <g><rect class="box core" x="713" y="192" width="190" height="82" rx="12"/><text class="eyebrow" x="808" y="218" text-anchor="middle">AUTHORITATIVE</text><text class="label" x="808" y="247" text-anchor="middle">Gahyeon Core</text></g>
  <g><rect class="box" x="968" y="192" width="176" height="82" rx="12"/><text class="label" x="1056" y="239" text-anchor="middle">PostgreSQL</text></g>
  <g><rect class="box external" x="468" y="89" width="180" height="58" rx="11"/><text class="label" x="558" y="114" text-anchor="middle">AI &amp; speech providers</text><text class="sub" x="558" y="132" text-anchor="middle">LLM · safety · STT · TTS</text></g>

  <g><rect class="box" x="663" y="326" width="290" height="92" rx="12"/><text class="eyebrow" x="681" y="348">REAL-TIME ARBITRATION</text><line x1="681" y1="374" x2="935" y2="374" stroke="#334155"/>
    <circle class="beat" cx="706" cy="390" r="6" fill="#22d3ee"/><text class="label" x="720" y="395">Reflex</text><text class="sub" x="720" y="411">16–100ms</text>
    <circle class="beat b2" cx="796" cy="390" r="6" fill="#34d399"/><text class="label" x="810" y="395">Behavior</text><text class="sub" x="810" y="411">100–500ms</text>
    <circle class="beat b3" cx="899" cy="390" r="6" fill="#a78bfa"/><text class="label" x="913" y="395">Cognition</text><text class="sub" x="913" y="411">500ms–s</text>
  </g>
</svg>
