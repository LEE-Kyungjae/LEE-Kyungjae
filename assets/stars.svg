<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kyungjae Lee — Agentic Systems and Backend Engineering</title>
  <desc id="desc">A deep-space profile banner with three layers of stars flowing upward at different speeds.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060914"/>
      <stop offset="0.52" stop-color="#0b1525"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>

    <g id="fine-stars" fill="#dbeafe">
      <circle cx="43" cy="38" r=".7"/><circle cx="128" cy="92" r=".6"/><circle cx="218" cy="32" r=".8"/>
      <circle cx="307" cy="119" r=".55"/><circle cx="392" cy="55" r=".65"/><circle cx="482" cy="146" r=".7"/>
      <circle cx="572" cy="73" r=".5"/><circle cx="657" cy="24" r=".75"/><circle cx="738" cy="128" r=".55"/>
      <circle cx="829" cy="61" r=".7"/><circle cx="917" cy="151" r=".6"/><circle cx="1002" cy="88" r=".8"/>
      <circle cx="1096" cy="31" r=".6"/><circle cx="1163" cy="137" r=".7"/><circle cx="76" cy="212" r=".6"/>
      <circle cx="173" cy="171" r=".75"/><circle cx="267" cy="264" r=".55"/><circle cx="351" cy="202" r=".7"/>
      <circle cx="445" cy="317" r=".65"/><circle cx="538" cy="238" r=".5"/><circle cx="624" cy="302" r=".75"/>
      <circle cx="711" cy="218" r=".55"/><circle cx="802" cy="327" r=".7"/><circle cx="891" cy="247" r=".6"/>
      <circle cx="978" cy="305" r=".8"/><circle cx="1068" cy="223" r=".55"/><circle cx="1151" cy="291" r=".7"/>
    </g>
    <g id="mid-stars" fill="#e0f2fe">
      <circle cx="89" cy="71" r="1.1"/><circle cx="242" cy="143" r="1"/><circle cx="424" cy="83" r="1.2"/>
      <circle cx="603" cy="171" r=".95"/><circle cx="776" cy="42" r="1.15"/><circle cx="949" cy="115" r="1"/>
      <circle cx="1124" cy="67" r="1.2"/><circle cx="158" cy="294" r="1"/><circle cx="333" cy="239" r="1.15"/>
      <circle cx="514" cy="331" r=".95"/><circle cx="688" cy="267" r="1.2"/><circle cx="867" cy="311" r="1"/>
      <circle cx="1043" cy="258" r="1.15"/>
    </g>
    <g id="near-stars" fill="#fff">
      <circle cx="54" cy="156" r="1.7"/><circle cx="285" cy="54" r="1.5"/><circle cx="497" cy="281" r="1.8"/>
      <circle cx="716" cy="101" r="1.55"/><circle cx="930" cy="44" r="1.75"/><circle cx="1139" cy="201" r="1.5"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#space)"/>
    <path d="M0 307C189 274 332 342 518 305s318-17 420 16 177 18 262-3v42H0Z" fill="#020617" opacity=".36"/>

    <g opacity=".62" class="stars fine">
      <use href="#fine-stars"/><use href="#fine-stars" y="360"/>
    </g>
    <g opacity=".78" class="stars mid">
      <use href="#mid-stars"/><use href="#mid-stars" y="360"/>
    </g>
    <g opacity=".95" class="stars near">
      <use href="#near-stars"/><use href="#near-stars" y="360"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="76" y="82" fill="#67e8f9" font-size="12" font-weight="700" letter-spacing="3.2">ENGINEERING SYSTEMS THAT ENDURE</text>
      <text x="72" y="156" fill="#f8fafc" font-size="51" font-weight="680" letter-spacing="-1.8">Kyungjae Lee</text>
      <rect x="75" y="181" width="58" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="75" y="224" fill="#cbd5e1" font-size="19" font-weight="480" letter-spacing=".25">Agentic Systems · Backend Engineering · Developer Tools</text>
      <text x="75" y="270" fill="#94a3b8" font-size="14.5">Building software that can explain, execute, observe, and recover.</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="359" rx="19.5" fill="none" stroke="#7dd3fc" stroke-opacity=".14"/>
  </g>

  <style>
    .fine { animation: flow-up 3s linear infinite; }
    .mid { animation: flow-up 6s linear infinite; }
    .near { animation: flow-up 9s linear infinite; }
    @keyframes flow-up { to { transform: translateY(-360px); } }
    @media (prefers-reduced-motion: reduce) {
      .stars { animation: none; }
    }
  </style>
</svg>
