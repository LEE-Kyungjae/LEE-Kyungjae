<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc">
  <title id="title">Palamedes mission intelligence architecture</title>
  <desc id="desc">World signals flow through observation, competing cognition, evidence pressure, and a bounded mission contract before reaching an external execution host. Outcomes return as new evidence. Revisionable state preserves reasoning lineage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#10192b"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#8b5cf6"/></marker>
    <style>
      .box{fill:#111c30;stroke:#334155;stroke-width:1}.key{stroke:#8b5cf6;stroke-width:1.5}.external{stroke:#64748b;stroke-dasharray:5 4}.label{fill:#f8fafc;font:600 14px ui-sans-serif,system-ui,sans-serif}.sub{fill:#94a3b8;font:11px ui-sans-serif,system-ui,sans-serif}.eyebrow{fill:#a78bfa;font:700 11px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.6px}.title{fill:#f8fafc;font:700 22px ui-sans-serif,system-ui,sans-serif}.note{fill:#cbd5e1;font:12px ui-sans-serif,system-ui,sans-serif}.flow{fill:none;stroke:#8b5cf6;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:9 8;animation:travel 3.6s linear infinite}.branch{fill:none;stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 6;animation:travel 5.5s linear infinite}.pulse{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}.p5{animation-delay:2.4s}.p6{animation-delay:3s}@keyframes travel{to{stroke-dashoffset:-68}}@keyframes pulse{0%,18%,100%{filter:none}9%{filter:url(#glow)}}@media(prefers-reduced-motion:reduce){.flow,.branch,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1180" height="430" rx="18" fill="url(#bg)"/><rect width="1180" height="430" rx="18" fill="url(#grid)"/>
  <text x="36" y="42" class="eyebrow">PALAMEDES / GOAL DISCOVERY ENGINE</text>
  <text x="36" y="72" class="title">Decide what is worth pursuing before deciding how to build it.</text>

  <path class="flow" d="M176 194H222"/><path class="flow" d="M358 194H404"/><path class="flow" d="M552 194H598"/><path class="flow" d="M746 194H792"/><path class="flow" d="M940 194H986"/>
  <path class="branch" d="M478 235V294"/><path class="branch" d="M552 330H866V235"/>
  <path class="branch" d="M1060 235V373H108V235" marker-end="url(#arrow)"/>

  <g class="pulse"><rect class="box external" x="36" y="153" width="140" height="82" rx="12"/><text class="label" x="106" y="199" text-anchor="middle">World signals</text></g>
  <g class="pulse p2"><rect class="box" x="222" y="153" width="136" height="82" rx="12"/><text class="label" x="290" y="199" text-anchor="middle">Observation</text></g>
  <g class="pulse p3"><rect class="box" x="404" y="153" width="148" height="82" rx="12"/><text class="label" x="478" y="190" text-anchor="middle">Competing</text><text class="label" x="478" y="208" text-anchor="middle">cognition</text></g>
  <g class="pulse p4"><rect class="box" x="598" y="153" width="148" height="82" rx="12"/><text class="label" x="672" y="190" text-anchor="middle">Evidence</text><text class="label" x="672" y="208" text-anchor="middle">pressure</text></g>
  <g class="pulse p5"><rect class="box key" x="792" y="153" width="148" height="82" rx="12"/><text class="eyebrow" x="866" y="181" text-anchor="middle">BOUNDED HANDOFF</text><text class="label" x="866" y="207" text-anchor="middle">Mission contract</text></g>
  <g class="pulse p6"><rect class="box external" x="986" y="153" width="158" height="82" rx="12"/><text class="label" x="1065" y="199" text-anchor="middle">Execution host</text></g>

  <g><rect class="box" x="404" y="294" width="148" height="72" rx="12"/><text class="label" x="478" y="335" text-anchor="middle">Revisionable state</text></g>
</svg>
